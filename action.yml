name: "CodeTether"
description: >-
  AI-powered code review and issue resolution.
  Dispatches tasks to persistent CodeTether workers via the fire-and-forget API.
  For the zero-config experience, install the GitHub App instead:
  https://github.com/apps/codetether
author: "rileyseaburg"

branding:
  icon: "code"
  color: "blue"

inputs:
  token:
    description: "CodeTether API token (from https://codetether.run → Settings → API Tokens)"
    required: true
  server_url:
    description: "CodeTether server URL"
    required: false
    default: "https://api.codetether.run"
  preset:
    description: >-
      Review focus preset: review (default), security, quality,
      performance, architecture, or a freeform prompt.
    required: false
    default: "review"
  extra_prompt:
    description: "Additional instructions appended to the review prompt"
    required: false
    default: ""
  auto_comment:
    description: "Post review as a comment on the issue/PR (true/false)"
    required: false
    default: "true"
  agent_type:
    description: "Agent type for task dispatch (overridden by preset)"
    required: false
    default: "code-review"
  max_steps:
    description: "Maximum agentic loop iterations"
    required: false
    default: "50"
  fail_on_error:
    description: >-
      When true, the action fails the workflow step if the dispatch
      itself fails. Task execution failures are always reported via
      GitHub comments.
    required: false
    default: "true"

outputs:
  review:
    description: "Dispatch confirmation with task_id and tracking URL"
    value: ${{ steps.dispatch.outputs.review }}
  exit_code:
    description: "Action exit code (0 = dispatch succeeded)"
    value: ${{ steps.dispatch.outputs.exit_code }}
  task_id:
    description: "Server task ID for tracking progress"
    value: ${{ steps.dispatch.outputs.task_id }}

runs:
  using: "composite"
  steps:
    - name: Dispatch task to CodeTether
      id: dispatch
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CODETETHER_SERVER: ${{ inputs.server_url }}
        CODETETHER_TOKEN: ${{ inputs.token }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_EXTRA_PROMPT: ${{ inputs.extra_prompt }}
        INPUT_AUTO_COMMENT: ${{ inputs.auto_comment }}
        INPUT_AGENT_TYPE: ${{ inputs.agent_type }}
        INPUT_MAX_STEPS: ${{ inputs.max_steps }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
        PR_BODY: ${{ github.event.pull_request.body || github.event.issue.body }}
        PR_BASE: ${{ github.event.pull_request.base.ref || '' }}
        PR_HEAD: ${{ github.event.pull_request.head.ref || '' }}
        REPO_FULL_NAME: ${{ github.repository }}
      run: ${{ github.action_path }}/dispatch.sh

    - name: Upload dispatch logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codetether-logs
        path: /tmp/codetether-dispatch/
        retention-days: 7
        if-no-files-found: ignore
