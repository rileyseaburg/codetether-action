name: Test Action

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  validate-action-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate action.yml
        run: |
          python3 -c "
          import yaml, sys
          with open('action.yml') as f:
              a = yaml.safe_load(f)
          assert 'name' in a, 'missing name'
          assert 'runs' in a, 'missing runs'
          assert a['runs']['using'] == 'composite', 'must be composite action'
          assert 'token' in a['inputs'], 'missing token input'
          print('action.yml is valid')
          "

      - name: Shellcheck dispatch script
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          check_together: 'yes'
        continue-on-error: true

  test-dispatch:
    needs: [validate-action-yaml]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch test task
        id: dispatch
        uses: ./
        with:
          token: ${{ secrets.CODETETHER_TOKEN }}
          extra_prompt: "This is a test dispatch. Respond with 'ok'."

      - name: Verify outputs
        run: |
          echo "Exit code: ${{ steps.dispatch.outputs.exit_code }}"
          echo "Task ID: ${{ steps.dispatch.outputs.task_id }}"
          [ "${{ steps.dispatch.outputs.exit_code }}" = "0" ] || echo "::warning::Dispatch did not return exit_code=0"
