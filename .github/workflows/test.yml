name: Test Action

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        # Only fail on errors (not style/info/warnings that are false positives).
        # SC1091: "Not following" sourced files (expected in composite actions).
        # SC2000: Suggests ${#var} but doesn't work for multiline strings.
        # SC2006: Backticks inside heredocs are intentional (prompt text).
        # SC2034: "appears unused" — many vars are used externally or exported.
        # SC2091: $() inside heredocs is intentional (template expansion).
        # SC2153: "Possible misspelling" — vars named via convention, not typos.
        # SC2155: "Declare and assign separately" — cosmetic only.
        # SC2317: "Unreachable" — invoked indirectly via source.
        run: |
          shellcheck -x -S error \
            --exclude=SC1091 \
            action/entrypoint.sh action/lib/*.sh

  action-yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate action.yml
        run: |
          # Validate action.yml schema using Python (the npm actionyaml-lint
          # package does not exist — it was a typo for action-lint).
          python3 -c "
          import yaml, sys
          with open('action.yml') as f:
              a = yaml.safe_load(f)
          assert 'name' in a, 'missing name'
          assert 'runs' in a, 'missing runs'
          assert a['runs']['using'] == 'composite', 'must be composite action'
          # Validate all run steps reference valid shells
          steps = a['runs'].get('steps', [])
          for i, step in enumerate(steps):
              if 'run' in step:
                  shell = step.get('shell', 'bash')
                  assert shell in ('bash', 'sh', 'zsh', 'pwsh', 'python'), \
                      f'step {i}: unsupported shell {shell!r}'
          print(f'action.yml is valid ({len(steps)} steps)')
          "

  test-server-mode:
    needs: [shellcheck]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run review (server mode)
        id: review
        uses: ./
        with:
          token: ${{ secrets.CODETETHER_TOKEN }}
          mode: server
          task_wait_seconds: "120"
          extra_prompt: "This is a test review. Keep it to one sentence."

      - name: Check output
        run: |
          echo "Exit code: ${{ steps.review.outputs.exit_code }}"
          echo "Review length: $(echo '${{ steps.review.outputs.review }}' | wc -c)"
